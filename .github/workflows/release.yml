# Build the release assets install.sh downloads.
#
# The point of this workflow is that a user installing Nora needs no toolchain:
# Go and Xcode are required to build the CLI collectors and the menubar app, so
# they are required here instead of on the user's Mac.
name: Release

on:
  push:
    tags:
      - 'v*'
      - 'V*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to build and publish, e.g. V0.1.0'
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    # Not just "the newest image": the universal app build needs Swift 6.2 or
    # later. On the macos-15 image (Swift 6.1.2) `swift build --arch arm64
    # --arch x86_64` rejects the target's swiftLanguageMode with
    # "given: [5], supported: []" — it never asks the toolchain which language
    # modes it has. Building one arch at a time would only trade that for an
    # untested path; the toolchain that works is the one to build on.
    runs-on: macos-26

    steps:
      - name: Resolve tag
        id: tag
        env:
          INPUT_TAG: ${{ inputs.tag }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          tag="${INPUT_TAG:-$REF_NAME}"
          case "$tag" in
            [Vv][0-9]*) ;;
            *)
              echo "Refusing to release from '$tag'; expected a version tag." >&2
              exit 1
              ;;
          esac
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.tag.outputs.tag }}

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Toolchain versions
        run: |
          sw_vers
          swift --version
          go version

      - name: Package release
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: ./scripts/package_release.sh --version "$TAG"

      # Install from the assets just built, exactly the way a user would. A
      # release that cannot be installed is worth catching before it is public.
      - name: Install from the built assets
        run: |
          NORA_RELEASE_BASE="file://$PWD/dist" \
          NORA_INSTALL_DIR="$RUNNER_TEMP/nora" \
          NORA_BIN_DIR="$RUNNER_TEMP/bin" \
          NORA_APP_DIR="$RUNNER_TEMP/Applications" \
            ./install.sh
          "$RUNNER_TEMP/bin/nora" --version
          "$RUNNER_TEMP/bin/nora" --help > /dev/null
          test -x "$RUNNER_TEMP/Applications/Nora.app/Contents/MacOS/NoraUI"

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          if ! gh release view "$TAG" > /dev/null 2>&1; then
            gh release create "$TAG" --title "$TAG" --generate-notes
          fi
          gh release upload "$TAG" \
            dist/nora-macos.tar.gz \
            dist/SHA256SUMS \
            --clobber
